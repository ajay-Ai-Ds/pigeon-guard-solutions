<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="440" height="80">
  <defs>
    <linearGradient id="shieldGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1E2C" />
      <stop offset="100%" stop-color="#4A1520" />
    </linearGradient>
    <linearGradient id="goldGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4A24C" />
      <stop offset="100%" stop-color="#B37E28" />
    </linearGradient>
  </defs>

  <!-- SE Shield Icon (Enlarged) -->
  <g transform="translate(6, 6) scale(1.15)">
    <!-- Outer Shield Badge -->
    <path d="M 30 3 L 55 12 V 30 C 55 45 43 55 30 58 C 17 55 5 45 5 30 V 12 Z" 
          fill="url(#shieldGradMain)" stroke="url(#goldGradMain)" stroke-width="2.8" />

    <!-- Subtle Inner Wires -->
    <g stroke="url(#goldGradMain)" stroke-width="0.85" stroke-opacity="0.4">
      <line x1="12" y1="18" x2="48" y2="44" />
      <line x1="48" y1="18" x2="12" y2="44" />
    </g>

    <!-- Inner Gold Frame -->
    <path d="M 30 7 L 50 14 V 29 C 50 41 40 50 30 53 C 20 50 10 41 10 29 V 14 Z" 
          fill="none" stroke="url(#goldGradMain)" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- SE Monogram -->
    <text x="30" y="37" 
          font-family="Inter, system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="21" 
          fill="url(#goldGradMain)" 
          text-anchor="middle" 
          letter-spacing="0.5">SE</text>
  </g>

  <!-- Main Business Name Typography (Big & Bold) -->
  <text x="86" y="44" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="30" 
        fill="#6B1E2C" 
        letter-spacing="-0.4">SHYAM ENTERPRISES</text>
  
  <!-- Subtitle Tagline -->
  <text x="87" y="64" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="11.5" 
        fill="#A07020" 
        letter-spacing="2.2">SAFETY NETS &amp; INVISIBLE GRILLS</text>
</svg>
