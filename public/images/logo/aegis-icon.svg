<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C4C" />
      <stop offset="100%" stop-color="#0A3838" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 50 6 L 88 20 V 48 C 88 70 70 88 50 94 C 30 88 12 70 12 48 V 20 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Inner Net Mesh Lines (Golden) -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.85">
    <!-- Diagonal Net Lines Left-to-Right -->
    <line x1="28" y1="35" x2="68" y2="75" />
    <line x1="22" y1="48" x2="58" y2="84" />
    <line x1="38" y1="24" x2="78" y2="64" />
    
    <!-- Diagonal Net Lines Right-to-Left -->
    <line x1="72" y1="35" x2="32" y2="75" />
    <line x1="78" y1="48" x2="42" y2="84" />
    <line x1="62" y1="24" x2="22" y2="64" />
  </g>
  
  <!-- Center Protective Emblem -->
  <path d="M 50 24 L 72 34 V 50 C 72 65 60 76 50 80 C 40 76 28 65 28 50 V 34 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
</svg>