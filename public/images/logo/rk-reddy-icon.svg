<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rkIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A2E3D" />
      <stop offset="100%" stop-color="#5A2230" />
    </linearGradient>
    <linearGradient id="rkIconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E5C4" />
      <stop offset="50%" stop-color="#C9963E" />
      <stop offset="100%" stop-color="#B8852F" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M 50 6 L 90 20 V 50 C 90 74 70 90 50 95 C 30 90 10 74 10 50 V 20 Z" 
        fill="url(#rkIconBg)" stroke="url(#rkIconGold)" stroke-width="4.5" />

  <!-- Subtle Safety Mesh/Wires -->
  <g stroke="url(#rkIconGold)" stroke-width="1.2" stroke-opacity="0.45">
    <line x1="20" y1="30" x2="80" y2="70" />
    <line x1="80" y1="30" x2="20" y2="70" />
    <line x1="30" y1="20" x2="70" y2="82" />
  </g>

  <!-- Inner Gold Shield Line -->
  <path d="M 50 13 L 82 24 V 48 C 82 68 66 82 50 86 C 34 82 18 68 18 48 V 24 Z" 
        fill="none" stroke="url(#rkIconGold)" stroke-width="2" stroke-opacity="0.75" />

  <!-- Monogram RK -->
  <text x="50" y="60" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="34" 
        fill="url(#rkIconGold)" 
        text-anchor="middle" 
        letter-spacing="0.5">RK</text>
</svg>
