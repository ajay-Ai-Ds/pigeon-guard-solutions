<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pgShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#051324" />
    </linearGradient>
    <linearGradient id="pgSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73D5FF" />
      <stop offset="50%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#29B6F6" />
    </linearGradient>
    <linearGradient id="pgSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>
    <filter id="pgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4FC3F7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 50 5 L 88 18 C 88 48, 73 78, 50 94 C 27 78, 12 48, 12 18 Z" 
        fill="url(#pgShieldBg)" stroke="url(#pgSkyGrad)" stroke-width="3.5" filter="url(#pgGlow)" />

  <!-- Safety Mesh / Grill Grid Texture in Backdrop -->
  <g stroke="#4FC3F7" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="1.5,1.5">
    <line x1="24" y1="28" x2="76" y2="28" />
    <line x1="18" y1="42" x2="82" y2="42" />
    <line x1="22" y1="56" x2="78" y2="56" />
    <line x1="30" y1="70" x2="70" y2="70" />
    
    <line x1="35" y1="16" x2="35" y2="78" />
    <line x1="50" y1="10" x2="50" y2="88" />
    <line x1="65" y1="16" x2="65" y2="78" />
  </g>

  <!-- Inner Crest Contour -->
  <path d="M 50 12 L 81 23 C 81 46, 68 70, 50 85 C 32 70, 19 46, 19 23 Z" 
        fill="none" stroke="url(#pgSkyGrad)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Modern Stylized Pigeon Silhouette & Protective Wing Geometry -->
  <!-- Wing Feather Layer 1 (Back Wing - Sky Blue) -->
  <path d="M 50 28 C 58 20, 68 22, 73 25 C 68 33, 58 39, 44 45 C 47 38, 48 33, 50 28 Z" 
        fill="url(#pgSkyGrad)" opacity="0.85" />

  <!-- Main Pigeon Body & Head - White/Silver Gradient -->
  <path d="M 36 34 C 36 29, 39 25, 43 25 C 47 25, 49 28, 51 32 C 54 30, 57 30, 59 31 C 57 34, 53 37, 49 39 C 45 44, 43 51, 44 60 C 40 56, 36 48, 36 41 C 33 41, 31 39, 30 38 C 32 37, 34 36, 36 34 Z" 
        fill="url(#pgSilverGrad)" />

  <!-- Eye Dot -->
  <circle cx="42.5" cy="28.5" r="1.5" fill="#0B2545" />

  <!-- Beak Accent -->
  <path d="M 33 30 L 30 31 L 34 33 Z" fill="url(#pgSkyGrad)" />

  <!-- Primary Dynamic Protective Wing Sweeping Across (Sky Blue Gradient) -->
  <path d="M 43 41 C 56 34, 69 36, 76 43 C 71 49, 61 54, 48 57 C 54 53, 59 48, 57 44 C 52 45, 47 47, 43 41 Z" 
        fill="url(#pgSkyGrad)" />

  <!-- Lower Wing Feather Arc -->
  <path d="M 46 54 C 55 51, 64 54, 70 60 C 64 64, 55 67, 46 67 C 50 63, 54 60, 53 57 C 49 57, 47 56, 46 54 Z" 
        fill="url(#pgSkyGrad)" opacity="0.9" />

  <!-- Base Shield Chevron Star / Anchor Anchor Point -->
  <path d="M 50 72 L 53 78 L 50 83 L 47 78 Z" fill="url(#pgSkyGrad)" />
</svg>
