<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100">
  <defs>
    <linearGradient id="pgShieldBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F335F" />
      <stop offset="100%" stop-color="#081E38" />
    </linearGradient>
    <linearGradient id="pgSkyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73D5FF" />
      <stop offset="50%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#29B6F6" />
    </linearGradient>
    <linearGradient id="pgSilverGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="pgIconGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4FC3F7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 3) scale(0.94)">
    <!-- Outer Protective Shield -->
    <path d="M 50 5 L 88 18 C 88 48, 73 78, 50 94 C 27 78, 12 48, 12 18 Z" 
          fill="url(#pgShieldBgLight)" stroke="url(#pgSkyGradLight)" stroke-width="3.5" filter="url(#pgIconGlowLight)" />

    <!-- Safety Mesh / Grill Grid Texture in Backdrop -->
    <g stroke="#4FC3F7" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="1.5,1.5">
      <line x1="24" y1="28" x2="76" y2="28" />
      <line x1="18" y1="42" x2="82" y2="42" />
      <line x1="22" y1="56" x2="78" y2="56" />
      <line x1="30" y1="70" x2="70" y2="70" />
      <line x1="35" y1="16" x2="35" y2="78" />
      <line x1="50" y1="10" x2="50" y2="88" />
      <line x1="65" y1="16" x2="65" y2="78" />
    </g>

    <!-- Inner Crest Contour -->
    <path d="M 50 12 L 81 23 C 81 46, 68 70, 50 85 C 32 70, 19 46, 19 23 Z" 
          fill="none" stroke="url(#pgSkyGradLight)" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Pigeon Back Wing -->
    <path d="M 50 28 C 58 20, 68 22, 73 25 C 68 33, 58 39, 44 45 C 47 38, 48 33, 50 28 Z" 
          fill="url(#pgSkyGradLight)" opacity="0.85" />

    <!-- Pigeon Body & Head -->
    <path d="M 36 34 C 36 29, 39 25, 43 25 C 47 25, 49 28, 51 32 C 54 30, 57 30, 59 31 C 57 34, 53 37, 49 39 C 45 44, 43 51, 44 60 C 40 56, 36 48, 36 41 C 33 41, 31 39, 30 38 C 32 37, 34 36, 36 34 Z" 
          fill="url(#pgSilverGradLight)" />

    <!-- Eye Dot -->
    <circle cx="42.5" cy="28.5" r="1.5" fill="#0B2545" />

    <!-- Beak Accent -->
    <path d="M 33 30 L 30 31 L 34 33 Z" fill="url(#pgSkyGradLight)" />

    <!-- Primary Dynamic Protective Wing -->
    <path d="M 43 41 C 56 34, 69 36, 76 43 C 71 49, 61 54, 48 57 C 54 53, 59 48, 57 44 C 52 45, 47 47, 43 41 Z" 
          fill="url(#pgSkyGradLight)" />

    <!-- Lower Wing Feather Arc -->
    <path d="M 46 54 C 55 51, 64 54, 70 60 C 64 64, 55 67, 46 67 C 50 63, 54 60, 53 57 C 49 57, 47 56, 46 54 Z" 
          fill="url(#pgSkyGradLight)" opacity="0.95" />

    <!-- Base Shield Chevron -->
    <path d="M 50 72 L 53 78 L 50 83 L 47 78 Z" fill="url(#pgSkyGradLight)" />
  </g>

  <!-- LOGO TEXT - LIGHT THEME (For Dark Navy/Black backgrounds) -->
  <g transform="translate(112, 0)">
    <!-- PIGEON GUARD -->
    <text x="0" y="44" 
          font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="29" 
          fill="#FFFFFF" 
          letter-spacing="0.5">
      PIGEON <tspan fill="#4FC3F7">GUARD</tspan>
    </text>

    <!-- SOLUTIONS -->
    <text x="260" y="44" 
          font-family="Outfit, Inter, system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="20" 
          fill="#94A3B8" 
          letter-spacing="2">
      SOLUTIONS
    </text>

    <!-- ACCENT DIVIDER LINE -->
    <line x1="0" y1="58" x2="368" y2="58" stroke="#133E6F" stroke-width="1.5" />
    <line x1="0" y1="58" x2="110" y2="58" stroke="#4FC3F7" stroke-width="2.5" stroke-linecap="round" />

    <!-- TAGLINE -->
    <text x="1" y="78" 
          font-family="Inter, system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="10.5" 
          fill="#94A3B8" 
          letter-spacing="3.2">
      SAFETY NETS &amp; INVISIBLE GRILLS
    </text>
  </g>
</svg>
