<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="460" height="80">
  <defs>
    <linearGradient id="rkShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A2E3D" />
      <stop offset="100%" stop-color="#5A2230" />
    </linearGradient>
    <linearGradient id="rkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E5C4" />
      <stop offset="50%" stop-color="#C9963E" />
      <stop offset="100%" stop-color="#B8852F" />
    </linearGradient>
  </defs>

  <!-- RK Shield Icon -->
  <g transform="translate(6, 6) scale(1.15)">
    <!-- Outer Shield Badge -->
    <path d="M 30 3 L 55 12 V 30 C 55 45 43 55 30 58 C 17 55 5 45 5 30 V 12 Z" 
          fill="url(#rkShieldGrad)" stroke="url(#rkGoldGrad)" stroke-width="2.8" />

    <!-- Subtle Safety Wires Motif -->
    <g stroke="url(#rkGoldGrad)" stroke-width="0.85" stroke-opacity="0.45">
      <line x1="12" y1="18" x2="48" y2="44" />
      <line x1="48" y1="18" x2="12" y2="44" />
      <line x1="18" y1="12" x2="42" y2="50" />
    </g>

    <!-- Inner Gold Frame -->
    <path d="M 30 7 L 50 14 V 29 C 50 41 40 50 30 53 C 20 50 10 41 10 29 V 14 Z" 
          fill="none" stroke="url(#rkGoldGrad)" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- RK Monogram -->
    <text x="30" y="37" 
          font-family="Inter, system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="20" 
          fill="url(#rkGoldGrad)" 
          text-anchor="middle" 
          letter-spacing="0.5">RK</text>
  </g>

  <!-- Main Business Name Typography -->
  <text x="86" y="44" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="28" 
        fill="#7A2E3D" 
        letter-spacing="-0.3">PIGEON GUARD SOLUTIONS</text>
  
  <!-- Subtitle Tagline -->
  <text x="87" y="64" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="11.5" 
        fill="#C9963E" 
        letter-spacing="2.2">SAFETY NETS &amp; INVISIBLE GRILLS</text>
</svg>
